# Template pyproject.toml for a CHORD package. Replace <package> and fill in the
# dependencies.

[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
name = "<package>"
authors = [
  {name = "The CHORD Collaboration"}
]
description = "<one-line description>"
requires-python = ">=3.10"
dynamic = ["readme", "version"]
license = {file = "LICENSE"}
dependencies = [
    # public repositories over https, private ones over ssh
    "caput @ git+https://github.com/radiocosmology/caput.git",
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mpi",
]
docs = [
    "numpydoc",
    "Sphinx",
    "sphinx_rtd_theme",
]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools-git-versioning]
enabled = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
# Same rules as CHIME's ch_pipeline: pycodestyle, pydocstyle, pyflakes, isort,
# pyupgrade, numpy, ruff, blind-except, comprehensions, returns
lint.select = ["E", "D", "F", "I", "UP", "NPY", "RUF", "BLE", "C4", "RET"]
lint.ignore = [
    "E501",  # line length is handled by the formatter
    "D105",  # docstrings for magic methods
    "D107",  # docstrings for __init__ (document the class instead)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
